[workspace]
resolver = "3"
members = ["abi", "kernel", "user", "mkfs", "xtask"]
default-members = ["abi", "mkfs", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
